<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RGB on Arkade · prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee; --dim:#8a93a6; --acc:#7c9cff; --ok:#3ecf8e; --err:#ff6b6b; --warn:#f5b84b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .pill { padding:2px 8px; border-radius:10px; background:#222839; color:var(--dim); font-size:12px; }
  .pill.busy { background:#3a2f12; color:var(--warn); }
  main { display:grid; grid-template-columns: 1fr 1fr 1.1fr; gap:14px; padding:14px 20px; }
  @media (max-width: 1200px) { main { grid-template-columns: 1fr 1fr; } #logcol { grid-column: 1 / -1; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  h2 { margin:0 0 6px; font-size:16px; text-transform:capitalize; }
  h3 { margin:12px 0 4px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; word-break:break-all; }
  .dim { color:var(--dim); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:3px 4px; border-bottom:1px solid #222733; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .big { font-size:20px; font-weight:600; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0; }
  button { background:#24304d; color:var(--fg); border:1px solid #33416a; border-radius:6px; padding:5px 9px; cursor:pointer; font-size:13px; }
  button:hover { background:#2d3b60; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input, select { background:#10131a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:13px; }
  input[type=number] { width:90px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:8px; background:#253049; }
  .tag.vtxo { background:#1e3a5f; } .tag.unrolled { background:#5a3a1a; } .tag.exit-output { background:#3d2a5c; } .tag.onchain { background:#1f4d39; }
  #log { max-height: calc(100vh - 150px); overflow:auto; }
  .le { padding:4px 0; border-bottom:1px solid #222733; }
  .le .t { color:var(--dim); font-size:11px; margin-right:6px; }
  .le .a { color:var(--acc); font-size:12px; margin-right:6px; }
  .k-ok, .k-done { color:var(--ok); } .k-error { color:var(--err); } .k-tx { color:var(--warn); } .k-start { color:var(--acc); }
  footer { padding:0 20px 16px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>RGB on Arkade · regtest prototype</h1>
  <span class="pill" id="busy">idle</span>
  <span class="pill" id="arkd">arkd …</span>
  <span class="pill" id="height">height …</span>
  <div class="row">
    <button onclick="act({action:'mine', blocks:+v('mineN')})">Mine</button><input id="mineN" type="number" value="1" min="1" max="500"> blocks
  </div>
  <div class="row">
    <button onclick="act({action:'set_expiry', seconds:+v('exp')})">Set batch expiry</button><input id="exp" type="number" value="604672" min="512"> s
    <span class="dim">(600 to try sweep recovery; 604672 = default)</span>
  </div>
  <div class="row">
    <button onclick="automine(+v('am'))">Auto-mine</button><input id="am" type="number" value="10" min="1"> s
    <button onclick="automine(0)">Stop</button><span class="pill" id="amst">auto-mine off</span>
  </div>
  <button onclick="act({action:'sync'})">Refresh view</button>
</header>
<main>
  <section id="w0"></section>
  <section id="w1"></section>
  <section id="logcol"><h2>Activity</h2><div id="log"></div></section>
</main>
<footer>State dir: <span class="mono" id="sdir"></span>. Wallets live in memory for this session; restarting the app starts fresh wallets.</footer>
<script>
const NAMES = ['alice', 'bob'];
let st = null, busy = null, lastLog = -1;
const v = id => document.getElementById(id).value;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = s => { s = String(s ?? ''); return s.length > 22 ? s.slice(0, 10) + '…' + s.slice(-10) : s; };
const fmtS = s => s == null ? '' : (s < 0 ? 'expired ' + dur(-s) + ' ago' : 'in ' + dur(s));
const dur = s => s > 86400 ? (s/86400).toFixed(1) + ' d' : s > 3600 ? (s/3600).toFixed(1) + ' h' : s > 60 ? Math.round(s/60) + ' min' : s + ' s';

async function act(body) {
  const r = await fetch('/api/action', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) alert(j.error || ('HTTP ' + r.status));
  poll();
}

async function automine(seconds) {
  await fetch('/api/automine', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({seconds})});
  poll();
}

function walletHtml(w, i) {
  const other = NAMES[1 - i];
  const b = w.btc || {};
  const assets = w.assets || [];
  const hold = w.holdings || [];
  const ids = [...new Set(hold.map(h => h.asset_id))];
  const sel = (id, kinds) => `<select id="${id}">${ids.filter(a => hold.some(h => h.asset_id === a && kinds.includes(h.kind))).map(a => `<option value="${esc(a)}">${esc(short(a))}</option>`).join('')}</select>`;
  const has = kinds => hold.some(h => kinds.includes(h.kind));
  const dis = busy ? 'disabled' : '';
  return `
  <h2>${esc(w.name)}</h2>
  <div class="mono dim" title="Ark address">${esc(short(w.ark_address))}</div>
  <h3>Bitcoin (Ark)</h3>
  <div><span class="big">${(b.offchain_confirmed ?? 0) + (b.offchain_preconfirmed ?? 0)}</span> sat off-chain
    <span class="dim">(${b.offchain_confirmed ?? 0} settled, ${b.offchain_preconfirmed ?? 0} preconfirmed${b.recoverable ? ', ' + b.recoverable + ' recoverable' : ''})</span></div>
  <h3>RGB assets</h3>
  ${assets.length ? `<table><tr><th>asset</th><th>Ark active</th><th>to recover</th><th>unrolled</th><th title="rgb-lib's stock balance, which does not know about Ark spends">stock rgb-lib</th></tr>
    ${assets.map(a => `<tr><td class="mono" title="${esc(a.asset_id)}">${esc(a.ticker || 'asset')}<br>${esc(short(a.asset_id))}</td>
      <td class="big">${a.ark ? a.ark.active : '–'}</td><td>${a.ark ? a.ark.to_recover : '–'}</td><td>${a.ark ? a.ark.unrolled : '–'}</td>
      <td class="dim">${a.onchain ? a.onchain.settled + (a.onchain.future !== a.onchain.settled ? ' (future ' + a.onchain.future + ')' : '') : '–'}</td></tr>`).join('')}</table>`
    : '<div class="dim">none yet</div>'}
  <h3>Colored outputs tracked by the app</h3>
  ${hold.length ? `<table><tr><th>kind</th><th>amount</th><th>outpoint</th><th>status</th></tr>
    ${hold.map(h => `<tr><td><span class="tag ${esc(h.kind)}">${esc(h.kind)}</span></td><td>${h.amount}</td>
      <td class="mono" title="${esc(h.outpoint)}">${esc(short(h.outpoint))}</td>
      <td class="dim">${h.kind === 'vtxo' ? (h.spent ? 'spent' : h.swept ? '<span class="k-error">swept</span>' : 'expires ' + fmtS(h.expires_in)) : (h.confirmations != null ? h.confirmations + ' conf' : '')}</td></tr>`).join('')}</table>`
    : '<div class="dim">none</div>'}
  <h3>VTXOs</h3>
  ${(w.vtxos || []).length ? `<table><tr><th>outpoint</th><th>sat</th><th>status</th></tr>
    ${w.vtxos.map(x => `<tr><td class="mono" title="${esc(x.outpoint)}">${esc(short(x.outpoint))}</td><td>${x.sat}</td><td class="dim">${esc(x.status)}, ${fmtS(x.expires_in)}</td></tr>`).join('')}</table>`
    : '<div class="dim">none</div>'}
  <h3>Actions</h3>
  <div class="row"><button ${dis} onclick="act({action:'board', who:'${w.name}', sats:+v('bs${i}')})">Board BTC</button><input id="bs${i}" type="number" value="100000"> sat</div>
  <div class="row"><button ${dis} onclick="act({action:'issue', who:'${w.name}'})">Issue asset + jump-in</button><span class="dim">needs a BTC-only VTXO</span></div>
  ${has(['vtxo']) ? `
  <div class="row"><button ${dis} onclick="act({action:'send', from:'${w.name}', to:'${other}', asset_id:v('sa${i}'), amount:+v('sn${i}')})">Send off-chain to ${other}</button>
    ${sel('sa' + i, ['vtxo'])}<input id="sn${i}" type="number" value="300" min="1"></div>
  <div class="row">${sel('ra' + i, ['vtxo'])}
    <button ${dis} onclick="act({action:'refresh', who:'${w.name}', asset_id:v('ra${i}')})">Refresh</button>
    <button ${dis} onclick="act({action:'recover', who:'${w.name}', asset_id:v('ra${i}')})">Recover swept</button>
    <button ${dis} onclick="act({action:'collab_exit', who:'${w.name}', asset_id:v('ra${i}')})">Collaborative exit</button>
    <button ${dis} onclick="act({action:'unilateral_exit', who:'${w.name}', asset_id:v('ra${i}')})">Unilateral exit</button></div>` : ''}
  ${has(['unrolled', 'exit-output']) ? `
  <div class="row"><button ${dis} onclick="act({action:'onchain_send', from:'${w.name}', to:'${other}', asset_id:v('oa${i}')})">Send on-chain to ${other}</button>${sel('oa' + i, ['unrolled', 'exit-output'])}</div>` : ''}
  `;
}

function render() {
  if (!st) return;
  busy = st.busy;
  const bp = document.getElementById('busy');
  bp.textContent = busy ? 'running: ' + busy : 'idle'; bp.className = 'pill' + (busy ? ' busy' : '');
  document.getElementById('arkd').textContent = 'arkd ' + (st.arkd && st.arkd.version || '?');
  document.getElementById('height').textContent = 'height ' + st.height;
  document.getElementById('amst').textContent = st.automine ? 'auto-mine every ' + st.automine + ' s' : 'auto-mine off';
  document.getElementById('sdir').textContent = st.state_dir;
  // keep form values across re-renders
  const keep = {}; document.querySelectorAll('main input, main select').forEach(e => keep[e.id] = e.value);
  (st.wallets || []).forEach((w, i) => { const el = document.getElementById('w' + i); if (el) el.innerHTML = walletHtml(w, i); });
  Object.entries(keep).forEach(([id, val]) => { const e = document.getElementById(id); if (e && [...(e.options || [{value: val}])].some(o => o.value === val)) e.value = val; });
  const key = st.log.length + ':' + (st.log.length ? st.log[st.log.length - 1].t + st.log[st.log.length - 1].msg : '');
  if (key !== lastLog) {
    lastLog = key;
    document.getElementById('log').innerHTML = st.log.slice().reverse().map(e =>
      `<div class="le"><span class="t">${new Date(e.t * 1000).toLocaleTimeString()}</span><span class="a">${esc(e.action)}</span><span class="k-${esc(e.kind)}">${e.kind === 'tx' ? '' : esc(e.kind) + ': '}</span><span class="${e.kind === 'tx' ? 'mono' : ''}">${esc(e.msg)}</span></div>`).join('');
  }
}

async function poll() {
  try { st = await (await fetch('/api/state')).json(); render(); } catch (e) { document.getElementById('busy').textContent = 'app unreachable'; }
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
